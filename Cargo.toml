[package]
name = "mdroll"
version = "0.1.3"
edition = "2024"
description = "A terminal Markdown viewer with big headings and real GFM support"
license = "MIT"
repository = "https://github.com/tokuhirom/mdroll"
readme = "README.md"
keywords = ["markdown", "terminal", "viewer", "cjk", "tui"]
categories = ["command-line-utilities", "text-processing"]

[dependencies]
ab_glyph = "0.2.32"
anyhow = "1.0.104"
arboard = { version = "3.6.1", default-features = false }
base64 = "0.23.0"
clap = { version = "4.6.4", features = ["derive"] }
clap_mangen = "0.3.0"
comrak = { version = "0.54.0", default-features = false, features = ["shortcodes"] }
crossterm = "0.29.0"
dirs = "6.0.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
resvg = "0.47.0"
serde = { version = "1.0.229", features = ["derive"] }
syntect = { version = "5.3.0", default-features = false, features = [
    "default-fancy",
] }
toml = "1.1.4"
unicode-linebreak = "0.1.5"
unicode-width = "0.2.2"
ureq = "3.3.0"

[profile.release]
lto = true
strip = true
codegen-units = 1

[target."cfg(unix)".dependencies]
libc = "0.2.189"
