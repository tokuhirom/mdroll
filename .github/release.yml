# Release notes, generated by GitHub from the pull requests merged since the
# previous tag. `generate_release_notes: true` in release.yml picks this up.
#
# The categories are driven by pull request *labels*, so a PR with no label
# lands in the last one rather than disappearing. Label as you open, not at
# release time: by then nobody remembers which change was which.
changelog:
  exclude:
    authors: [dependabot, github-actions]
  categories:
    # What the viewer now shows that it did not, or shows differently.
    - title: Rendering
      labels: [rendering]
    - title: Fixes
      labels: [bug]
    # Anything about what a particular terminal, multiplexer, or OS can do.
    - title: Terminals and platforms
      labels: [terminal]
    - title: Documentation
      labels: [documentation]
    - title: Other changes
      labels: ["*"]
